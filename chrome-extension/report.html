<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeScore - Analysis Report</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e5e7eb;
    }
    
    .header h1 {
      color: #667eea;
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .score-large {
      font-size: 72px;
      font-weight: 700;
      color: #667eea;
      margin: 20px 0;
    }
    
    .section {
      margin: 30px 0;
      padding: 20px;
      background: #f9fafb;
      border-radius: 8px;
    }
    
    .section h2 {
      color: #374151;
      margin-bottom: 15px;
      font-size: 20px;
    }
    
    .section ul {
      list-style: none;
      padding: 0;
    }
    
    .section li {
      padding: 10px;
      margin: 5px 0;
      background: white;
      border-left: 4px solid #667eea;
      border-radius: 4px;
    }
    
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .skill-tag {
      padding: 6px 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
    }
    
    .job-description {
      background: #fef3c7;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #f59e0b;
    }
    
    .timestamp {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ResumeScore Analysis Report</h1>
      <div class="score-large" id="score">0%</div>
      <p id="candidateName">Candidate Analysis</p>
    </div>
    
    <div class="section">
      <h2>Job Description</h2>
      <div class="job-description" id="jobDescription"></div>
    </div>
    
    <div class="section">
      <h2>✅ Strengths</h2>
      <ul id="strengths"></ul>
    </div>
    
    <div class="section">
      <h2>⚠️ Areas to Improve</h2>
      <ul id="weaknesses"></ul>
    </div>
    
    <div class="section">
      <h2>🔧 Matched Skills</h2>
      <div class="skills" id="skills"></div>
    </div>
    
    <div class="timestamp" id="timestamp"></div>
  </div>
  
  <script src="report.js"></script>
</body>
</html>
