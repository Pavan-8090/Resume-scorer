<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeScore Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="ResumeScore" class="logo-img">
        <h1>ResumeScore</h1>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <!-- Job Description Section -->
    <div class="section" id="jobDescriptionSection">
      <label class="label">Job Description</label>
      <textarea 
        id="jobDescription" 
        class="textarea" 
        placeholder="Paste job description here or select from saved..."
        rows="4"
      ></textarea>
      <div class="button-group">
        <button id="useSavedJob" class="btn btn-secondary">Use Saved</button>
        <button id="saveJob" class="btn btn-secondary">Save This</button>
      </div>
    </div>

    <!-- Analysis Section -->
    <div class="section" id="analysisSection" style="display: none;">
      <div class="analysis-header">
        <h3>Analysis Results</h3>
        <button id="closeAnalysis" class="btn-close">×</button>
      </div>
      
      <!-- Match Score -->
      <div class="score-container">
        <div class="score-circle" id="scoreCircle">
          <span class="score-value" id="scoreValue">0</span>
          <span class="score-label">Match Score</span>
        </div>
      </div>

      <!-- Strengths -->
      <div class="result-section">
        <h4 class="section-title">✅ Strengths</h4>
        <ul class="result-list" id="strengthsList"></ul>
      </div>

      <!-- Weaknesses -->
      <div class="result-section">
        <h4 class="section-title">⚠️ Areas to Improve</h4>
        <ul class="result-list" id="weaknessesList"></ul>
      </div>

      <!-- Skills -->
      <div class="result-section">
        <h4 class="section-title">🔧 Matched Skills</h4>
        <div class="skills-container" id="skillsContainer"></div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="viewDetails" class="btn btn-primary">View Full Report</button>
        <button id="saveAnalysis" class="btn btn-secondary">Save to Dashboard</button>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading" id="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Analyzing resume...</p>
    </div>

    <!-- Error State -->
    <div class="error" id="error" style="display: none;">
      <p id="errorMessage"></p>
      <button id="retryBtn" class="btn btn-primary">Retry</button>
    </div>

    <!-- Main Actions -->
    <div class="actions-main" id="mainActions">
      <button id="analyzeBtn" class="btn btn-primary btn-large">
        <span class="btn-icon">🔍</span>
        Analyze Current Page
      </button>
      <button id="settingsBtn" class="btn btn-secondary">
        ⚙️ Settings
      </button>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel" style="display: none;">
      <h3>Settings</h3>
      <div class="setting-item">
        <label>Backend API URL</label>
        <input type="text" id="apiUrl" placeholder="http://localhost:5000" />
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="autoAnalyze" />
          Auto-analyze on LinkedIn profiles
        </label>
      </div>
      <button id="saveSettings" class="btn btn-primary">Save Settings</button>
      <button id="closeSettings" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
